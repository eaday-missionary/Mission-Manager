name: Build Windows Executable

on:
  workflow_dispatch:
  release:
    types:
      - published

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean MissionManager.spec

      - name: Archive distributable
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\MissionManager\* -DestinationPath .\dist\MissionManager-win.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissionManager-win
          path: dist/MissionManager-win.zip

      - name: Attach zip to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MissionManager-win.zip
